name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: bash -n build-sitemap.sh generate-pdf.sh && node --check assets/terminal.js
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-check-failures
          path: test-results/
          retention-days: 7
