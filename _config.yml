# Keep build sources and test tooling out of the GitHub Pages output.
exclude:
  - README.md
  - DEVELOPMENT.md
  - CLAUDE.md
  - node_modules
  - tests
  - test-results
  - playwright-report
  - package.json
  - package-lock.json
  - playwright.config.js
  - build-site.py
  - generate-pdf.sh
  - content
  - templates
