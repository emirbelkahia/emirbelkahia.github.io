<!DOCTYPE html>
<!-- Generated by build-site.py. Edit content/cv.json or templates/ instead. -->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>{{ name }} – {{ job_title }} &amp; AI Builder</title>
  <meta name="description" content="{{ description }}" />
  <link rel="canonical" href="{{ site_url }}" />
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site_url }}">
  <meta property="og:title" content="{{ name }} – {{ job_title }} &amp; AI Builder">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:image" content="{{ social_image_url }}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ name }} – {{ job_title }} &amp; AI Builder">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ name }} – {{ job_title }} &amp; AI Builder">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ social_image_url }}">
  <meta name="twitter:image:alt" content="{{ name }} – {{ job_title }} &amp; AI Builder">
  <link rel="describedby" type="text/markdown" href="{{ llms_url }}">
  <style>
{{ page_css }}
  </style>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
  <link rel="manifest" href="favicon/manifest.json">
  <meta name="theme-color" content="#0e0e0e">
  <!-- GoatCounter Analytics -->
  <script data-goatcounter="https://emirbelkahia.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <script type="application/ld+json">
{{ jsonld }}
  </script>
</head>

<body>
  <div class="container">
    <main>
      <picture>
        <source type="image/avif" srcset="assets/profile-pic-200.avif 200w, assets/profile-pic-400.avif 400w" sizes="160px">
        <source type="image/webp" srcset="assets/profile-pic-200.webp 200w, assets/profile-pic-400.webp 400w" sizes="160px">
        <img src="{{ image }}" alt="{{ name }}" class="profile-image" width="400" height="400" fetchpriority="high" loading="eager" decoding="async" />
      </picture>
      <h1>{{ name }}</h1>
      <p class="subtitle">{{ job_title }} &middot; AI Builder</p>
      <p class="tagline">{{ tagline }}</p>
      <nav class="links" aria-label="Profiles, writing and code">
{{ home_links }}
      </nav>
      <div class="cta">
      <a href="{{ linkedin_url }}" target="_blank" rel="me noopener" data-goatcounter-click="connect-linkedin">
        Connect with me on LinkedIn
      </a>
      </div>
    </main>
    <footer>
      made by {{ name }}, 2025<span class="terminal-hint"> &gt;_</span>
    </footer>
  </div>


  <script>
    // Easter egg. Detect the secret word here, and only then fetch
    // assets/terminal.js + assets/terminal.css. Visitors who never type it pay
    // nothing for it.
    (function () {
      var word = 'terminal', buf = '', timer = null, loading = false;
      document.addEventListener('keydown', function (e) {
        if (e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return;
        buf += e.key.toLowerCase();
        clearTimeout(timer);
        timer = setTimeout(function () { buf = ''; }, 2000);
        if (buf.indexOf(word) === -1) return;
        buf = '';
        if (window.__openTerminal) { window.__openTerminal(); return; }
        if (loading) return;
        loading = true;
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = 'assets/terminal.css';
        var js = document.createElement('script');
        js.src = 'assets/terminal.js';
        function retryAfterFailure() {
          loading = false;
          js.remove();
          css.remove();
        }
        css.onerror = js.onerror = retryAfterFailure;
        css.onload = function () { document.head.appendChild(js); };
        js.onload = function () {
          loading = false;
          window.__openTerminal();
        };
        document.head.appendChild(css);
      });
    })();
  </script>
</body>

</html>
